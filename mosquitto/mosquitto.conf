# ============================================================================
# Cấu hình Mosquitto MQTT Broker cho Đề tài Giám sát Điện năng Gia đình
# ============================================================================

# Lắng nghe kết nối MQTT chuẩn trên cổng 1883 (cho phép kết nối nội bộ & LAN)
listener 1883 0.0.0.0

# Cho phép kết nối không cần mật khẩu trong môi trường mô phỏng phòng Lab
allow_anonymous true

# Lưu trữ trạng thái tin nhắn Retain
persistence true
persistence_location ./

# Cấu hình hiển thị Log chi tiết để theo dõi gói tin
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
